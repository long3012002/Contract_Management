# 1. Chuyển hướng HTTP -> HTTPS
server {
    listen 80;
    server_name hopdong.co-opbank.vn 10.224.2.77;
    return 301 https://$host$request_uri;
}

# 2. Xử lý HTTPS chính
server {
    listen 443 ssl;
    server_name hopdong.co-opbank.vn 10.224.2.77;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root & Index
    root /var/www/qlhd;
    index index.html;

    # Frontend React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API - Backend
    location /api/ {
        proxy_pass http://10.224.0.26:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
    }

    # SignalR WebSocket - Backend
    location /hub/ {
        proxy_pass http://10.224.0.26:3000/hub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts cho WebSocket
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OnlyOffice API
    location /onlyoffice-api/ {
        proxy_pass http://10.224.0.26:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        
        # Timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

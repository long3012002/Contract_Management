version: '3.8'

services:
  # Backend API (.NET 8/9 ASP.NET Core Web API)
  backend:
    image: coopbank/qlda-backend:v1.0.0
    build:
      context: ../../backend/demo1
      dockerfile: demo1/Dockerfile
    container_name: qlda-backend-container
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Chuỗi kết nối Database PostgreSQL Production (10.225.11.201)
      - ConnectionStrings__DefaultConnection=Host=10.225.11.201;Port=5432;Database=QLDA;Username=user;Password=passsword;
      # Cấu hình TẮT AutoMigrate và Seed Data trên Production
      - Database__AutoMigrate=false
      - Database__SeedSampleData=false
      # JWT Settings (SecretKey >= 256 bits)
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      - JwtSettings__Issuer=https://qlda.coopbank.vn
      - JwtSettings__Audience=https://qlda.coopbank.vn
      - JwtSettings__ExpiryInMinutes=120
      - Auth__EnableDevBypass=false
      - Auth__EnableLocalPasswordLogin=false
      # RADIUS Server Integration (10.224.0.94)
      - Radius__Enabled=true
      - Radius__Server=10.224.0.94
      - Radius__SharedSecret=${RADIUS_SHARED_SECRET:?Set RADIUS_SHARED_SECRET}
      - Radius__Port=1812
      - Radius__Timeout=30000
      # SMTP Mail Server
      - EmailSettings__Host=smtp.coopbank.vn
      - EmailSettings__Port=587
      - EmailSettings__EnableSsl=true
      - EmailSettings__SenderEmail=no-reply-qlda@coopbank.vn
    volumes:
      - /var/log/qlda/backend:/app/logs
      - /var/qlda/uploads:/app/uploads
    networks:
      - qlda-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Reverse Proxy Nginx & Frontend Static Hosting
  nginx:
    image: nginx:1.25-alpine
    container_name: qlda-nginx-container
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - /etc/ssl/coopbank:/etc/nginx/ssl:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - backend
    networks:
      - qlda-network

networks:
  qlda-network:
    driver: bridge
